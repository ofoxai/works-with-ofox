<!doctype html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
.card{width:1200px;height:630px;background:linear-gradient(135deg,#C65D3B 0%,#E8805E 55%,#F5A882 100%);
  font-family:-apple-system,'Segoe UI','PingFang SC',sans-serif;color:#fff;position:relative;
  display:flex;flex-direction:column;justify-content:center;padding:96px}
.card::before{content:'';position:absolute;top:-120px;right:-80px;width:420px;height:420px;background:rgba(255,255,255,.10);border-radius:50%}
.card::after{content:'';position:absolute;bottom:-140px;left:60px;width:320px;height:320px;background:rgba(255,255,255,.07);border-radius:50%}
.dot{width:34px;height:34px;background:#fff;border-radius:50%;margin-bottom:40px;position:relative;z-index:1}
h1{font-size:104px;font-weight:800;line-height:1.05;letter-spacing:-2px;position:relative;z-index:1}
p{font-size:40px;font-weight:500;margin-top:28px;opacity:.95;position:relative;z-index:1}
.foot{position:absolute;bottom:64px;left:96px;font-size:30px;font-weight:600;opacity:.9;z-index:1}
</style></head><body>
<div class="card">
  <div class="dot"></div>
  <h1>Works with Ofox</h1>
  <p>Apps &amp; tools that work with Ofox — one key, every model.</p>
  <div class="foot">ofox.ai / awesome</div>
</div>
</body></html>
