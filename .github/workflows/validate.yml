name: Validate App Submission

on:
  pull_request:
    paths:
      - 'apps/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Find changed app directories
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # --diff-filter=ACMR excludes Deleted dirs (removing an app must not fail validation)
          CHANGED_DIRS=$(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" | grep '^apps/' | cut -d'/' -f2 | sort -u | tr '\n' ' ')
          echo "dirs=${CHANGED_DIRS}" >> "$GITHUB_OUTPUT"

      - name: Validate app submissions
        env:
          CHANGED_DIRS: ${{ steps.changed.outputs.dirs }}
        run: |
          if [ -n "$CHANGED_DIRS" ]; then
            # Pass each dir as a separate quoted argument
            echo "$CHANGED_DIRS" | tr ' ' '\n' | grep -E '^[a-z0-9-]+$' | xargs -I{} node scripts/validate.js "{}"
          else
            echo "No app changes detected"
          fi

      # Guard against drift: the committed apps.json / README must match what
      # generate-readme.js produces from apps/*.yaml (prevents hand-edited or stale copies).
      - name: Check apps.json / README are in sync
        run: |
          node scripts/generate-readme.js
          if ! git diff --quiet apps.json README.md; then
            echo "::error::apps.json/README.md are out of sync with apps/*.yaml. Do not edit them by hand — they are generated. Run 'node scripts/generate-readme.js' and commit."
            git diff --stat apps.json README.md
            exit 1
          fi
