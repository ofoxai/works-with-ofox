name: 提交应用 / Submit an app
description: 申请把一个支持 Ofox 的应用加入展示墙 / Request to add an Ofox-compatible app to the wall
title: "[App] <应用名 / app name>"
labels: ["app-submission"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交！直接提 PR 更快（见 [CONTRIBUTING.md](https://github.com/ofoxai/works-with-ofox/blob/main/CONTRIBUTING.md)）。
        Thanks! Opening a PR is faster — see [CONTRIBUTING.md](https://github.com/ofoxai/works-with-ofox/blob/main/CONTRIBUTING.md).
  - type: input
    id: name
    attributes:
      label: 应用名称 / App name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 应用链接 / App URL
      placeholder: https://
    validations:
      required: true
  - type: input
    id: ofox_doc
    attributes:
      label: 对方记录 Ofox 支持的页面 / Page where the app documents Ofox support
      description: 上墙硬门槛——必须是对方自己官网/仓库里写明支持 Ofox 的链接。Required — a link on the app's own site/repo.
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: tags
    attributes:
      label: 类别 / Category（可多选，最多 3 个）
      multiple: true
      options:
        - chat
        - coding
        - productivity
        - creative
        - research
        - other
    validations:
      required: true
  - type: input
    id: ofox_account
    attributes:
      label: Ofox 账户（注册邮箱）/ Ofox account (email)
      description: 用于发放 $5 开发激励金;仅用于发放,不会公开。Only for the $5 payout — never shown publicly.
      placeholder: you@example.com
    validations:
      required: true
  - type: input
    id: ofox_team
    attributes:
      label: 接收 $5 的 team 名称（选填）/ Team to credit (optional)
      description: 只在你有多个 Ofox 团队时填;只有一个团队会自动发放到该团队。Only if you have multiple teams — a single team is credited automatically.
  - type: input
    id: open_source
    attributes:
      label: 开源仓库（选填）/ Open-source repo (optional)
      placeholder: https://github.com/
  - type: textarea
    id: notes
    attributes:
      label: 影响力 / 用户基础 / Traction
      description: GitHub stars、用户数、下载量、社区活跃度等 / stars, users, downloads, community
